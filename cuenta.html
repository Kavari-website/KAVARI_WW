<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi cuenta · KAVARI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ui-system.css">
  <link rel="stylesheet" href="css/account.css">
  <link rel="stylesheet" href="css/nav-glass.css">
  <link rel="stylesheet" href="css/nav-unified.css">
  <link rel="stylesheet" href="css/site-polish.css">
  <link rel="stylesheet" href="css/tutorial.css">
  <script src="js/idioma.js"></script>
  <script src="js/theme.js"></script>
</head>
<body class="auth-page">
  <nav class="portal-nav" aria-label="Navegación de cuenta">
    <div class="portal-nav-start">
      <button class="portal-back" type="button" onclick="history.length > 1 ? history.back() : location.href='index.html'">← Volver</button>
      <a href="index.html" class="portal-brand">KAVARI</a>
    </div>
    <div class="portal-nav-actions">
      <a href="planes.html">Planes</a>
      <button class="nav-btn-tutorial" id="btnTutorial" onclick="startTutorial(true)">Tutorial</button>
      <button class="btn-lang-nav" id="btnLang" onclick="toggleLang()"><span id="langLabel">ES</span></button>
      <button class="btn-theme-nav" id="btnTheme" onclick="toggleTheme()">Oscuro</button>
    </div>
  </nav>
  <main class="auth-main"><section class="auth-shell">
    <aside class="auth-copy"><span>CUENTA KAVARI</span><h1>Tu próxima aventura empieza aquí.</h1><p>Guarda tu plan y vuelve a explorar KAVARI desde el mismo dispositivo.</p><ul class="auth-points"><li>✓ Plan y preferencias locales</li><li>✓ Acceso directo a tus planes</li><li>✓ Sin pagos en esta demo</li></ul></aside>
    <section class="auth-panel" id="accountCard"></section>
  </section></main>
  <script src="js/account.js"></script>
  <script src="js/tutorial.js"></script>
  <script>
    (function () {
      const root = document.getElementById('accountCard'); let mode = 'join';
      function planName(plan) { return ({ viajero: 'Viajero Gratis', premium: 'Premium', op: 'OP' })[plan] || plan; }
      function view() {
        const user = KavariAccount.getUser();
        if (user) {
          root.innerHTML = `<h2>Hola, ${user.name}</h2><p>Tu cuenta está activa en este navegador.</p><div class="auth-user"><strong>${user.email}</strong><br>Plan actual: ${planName(KavariAccount.getPlan())}<br><a href="planes.html">Gestionar plan</a><button id="logout">Cerrar sesión</button></div>`;
          document.getElementById('logout').onclick = () => { KavariAccount.logout(); view(); }; return;
        }
        root.innerHTML = `<h2>${mode === 'join' ? 'Únete a KAVARI' : 'Inicia sesión'}</h2><p>${mode === 'join' ? 'Crea una cuenta local para conservar tu plan.' : 'Accede con tu nombre y correo en este dispositivo.'}</p><div class="auth-tabs"><button class="${mode === 'join' ? 'active' : ''}" id="join">Crear cuenta</button><button class="${mode === 'login' ? 'active' : ''}" id="login">Ingresar</button></div><form id="form"><label>Nombre<input name="name" required autocomplete="name"></label><label>Correo electrónico<input name="email" type="email" required autocomplete="email"></label><label>Contraseña<input name="password" type="password" minlength="4" required autocomplete="current-password"></label><button class="auth-submit">${mode === 'join' ? 'Crear mi cuenta' : 'Ingresar'}</button></form>`;
        document.getElementById('join').onclick = () => { mode = 'join'; view(); };
        document.getElementById('login').onclick = () => { mode = 'login'; view(); };
        document.getElementById('form').onsubmit = event => { event.preventDefault(); const form = new FormData(event.target); KavariAccount.save({ name: form.get('name'), email: form.get('email') }); view(); };
      }
      view();
    })();
  </script>
</body>
</html>
