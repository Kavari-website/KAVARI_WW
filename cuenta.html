<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi cuenta · KAVARI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ui-system.css">
  <link rel="stylesheet" href="css/account.css">
  <link rel="stylesheet" href="css/nav-glass.css">
  <link rel="stylesheet" href="css/nav-unified.css">
  <link rel="stylesheet" href="css/site-polish.css">
  <link rel="stylesheet" href="css/tutorial.css">
  <script src="js/idioma.js"></script>
  <script src="js/theme.js"></script>
</head>
<body class="auth-page">
  <nav class="portal-nav" aria-label="Navegación de cuenta">
    <div class="portal-nav-start">
      <button class="portal-back" type="button" onclick="history.length > 1 ? history.back() : location.href='index.html'">← Volver</button>
      <a href="index.html" class="portal-brand">KAVARI</a>
    </div>
    <div class="portal-nav-actions">
      <a href="planes.html">Planes</a>
      <button class="nav-btn-tutorial" id="btnTutorial" onclick="startTutorial(true)">Tutorial</button>
      <button class="btn-lang-nav" id="btnLang" onclick="toggleLang()"><span id="langLabel">ES</span></button>
      <button class="btn-theme-nav" id="btnTheme" onclick="toggleTheme()">Oscuro</button>
    </div>
  </nav>

  <main class="auth-main">
    <section class="auth-shell">
      <div class="ticket-divider" aria-hidden="true"></div>

      <aside class="auth-copy">
        <span class="auth-kicker">Cuenta KAVARI</span>
        <div class="auth-route" aria-hidden="true">
          <span>TÚ</span>
          <span class="route-line"></span>
          <span>KAVARI</span>
        </div>
        <h1>Tu próxima aventura empieza aquí.</h1>
        <p>Guarda tu plan y vuelve a explorar KAVARI desde el mismo dispositivo.</p>
        <ul class="auth-points">
          <li><span class="point-icon">✓</span>Plan y preferencias locales</li>
          <li><span class="point-icon">✓</span>Acceso directo a tus planes</li>
          <li><span class="point-icon">✓</span>Sin pagos en esta demo</li>
        </ul>
        <div class="auth-barcode" aria-hidden="true"></div>
      </aside>

      <section class="auth-panel" id="accountCard" aria-live="polite"></section>
    </section>
  </main>

  <script src="js/account.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/cuenta-view.js"></script>
</body>
</html>
